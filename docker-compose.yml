services:
  # 1. Your Custom Zero-Trust Proxy Backend
  zero-trust-proxy:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: zero-trust-proxy
    ports:
      # Bind exclusively to localhost so LAN users cannot bypass Open WebUI
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - proxy-audit-logs:/app/logs
    restart: unless-stopped

  # 2. The Open WebUI Frontend Dashboard
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - 'OPENAI_API_BASE_URL=http://zero-trust-proxy:8000/v1'
      - 'OPENAI_API_KEY=sk-proxy'
      - 'WEBUI_SECRET_KEY=zero_trust_edge_node_secret_key_2026'
      - 'ENABLE_MESSAGE_RATING=False' 
      # Forces Open WebUI to forward user info as a signed JWT
      - 'ENABLE_FORWARD_USER_INFO_HEADERS=True'
      - 'ENABLE_FORWARD_USER_INFO_JWT=True'
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - zero-trust-proxy
    restart: unless-stopped

volumes:
  open-webui-data:
  proxy-audit-logs: