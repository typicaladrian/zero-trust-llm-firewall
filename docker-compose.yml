services:
  # 1. Your Custom Zero-Trust Proxy Backend
  zero-trust-proxy:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: zero-trust-proxy
    ports:
      - "8000:8000"
    env_file:
      - .env  
    restart: unless-stopped

  # 2. The Open WebUI Frontend Dashboard
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - 'OPENAI_API_BASE_URL=http://zero-trust-proxy:8000/v1'
      - 'OPENAI_API_KEY=sk-proxy'
      - 'WEBUI_SECRET_KEY=zero_trust_edge_node_secret_key_2026'
      # Disables the feedback buttons to prevent snapshot retention
      - 'ENABLE_MESSAGE_RATING=False' 
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - zero-trust-proxy
    restart: unless-stopped

# Restored the volume declaration
volumes:
  open-webui-data: