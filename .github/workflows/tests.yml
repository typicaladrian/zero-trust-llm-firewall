name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use LiteLLM's bundled model price map instead of fetching it at import time
  LITELLM_LOCAL_MODEL_COST_MAP: "True"
  PYTHONUNBUFFERED: "1"

jobs:
  fast:
    name: Fast tier (fake NER)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # matches the Docker image
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies (without GLiNER2 / PyTorch)
        run: |
          grep -v -i '^gliner2' requirements.txt > requirements-fast.txt
          pip install -r requirements-fast.txt pytest httpx

      - name: Run fast tier
        run: pytest

  model:
    name: Model tier (real GLiNER2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Cache GLiNER2 model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-gliner2-privacy-filter-PII-multi

      - name: Run model tier
        env:
          ZT_REAL_MODEL: "1"
        run: pytest -m model

  container:
    name: Container image (Lambda-ready)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The runner has about 14 GB free; the build needs the image (under 10 GB) plus layers.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      # Same commands as a local run: build (--provenance=false), size < 10 GB, .dockerignore
      # probe, then run read-only / non-root / no network and smoke-test redaction offline.
      - name: Build and check the image
        run: bash scripts/container_check.sh
